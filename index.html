<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/kincad.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KINCAD — AI-assisted CAD agent for kinematic analysis and synthesis of planar mechanisms." />
    <title>KINCAD — Kinematics CAD Agent</title>
    <!-- Applies the stored theme BEFORE first paint. ThemeProvider also does this, but from a
         React effect — which runs after the first paint has already committed, so the whole
         interface painted in the *other* palette and then transitioned into place. That was a
         visible cream flash on every dark-mode load (and the reverse in light), and it is worse
         now that both palettes are deeply tinted rather than near-white/near-black.

         Deliberately duplicates `initialTheme()` in src/theme.tsx — the two must stay in step
         (key `kincad-theme`, values `light`/`dark`, else the `prefers-color-scheme` fallback).
         Inline and blocking on purpose: an external or deferred script would paint first. -->
    <script>
      try {
        var t = localStorage.getItem("kincad-theme");
        if (t !== "light" && t !== "dark")
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.classList.toggle("dark", t === "dark");
      } catch (e) {
        /* private mode / storage blocked — fall through to ThemeProvider's effect */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
